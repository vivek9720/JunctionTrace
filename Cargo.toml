[package]
name = "junctiontrace"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Offline rail interlocking evidence bundle decoder and analyzer"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["rail", "parser", "fuzzing", "interlocking"]
categories = ["parser-implementations", "simulation"]

[dependencies]

[lib]
name = "junctiontrace"
path = "src/lib.rs"

[profile.dev]
overflow-checks = true

[profile.release]
opt-level = 3
debug = true
overflow-checks = true
panic = "abort"
